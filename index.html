    <script>
      // Ignore WebSocket disconnection errors in AI Studio iframe environment
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (
          (e.reason.message && e.reason.message.includes('WebSocket')) ||
          (typeof e.reason === 'string' && e.reason.includes('WebSocket'))
        )) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (e.message && e.message.includes('WebSocket')) {
          e.preventDefault();
        }
      });
    </script>
