<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Navy Gradients -->
    <linearGradient id="navyStemLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002b5c"/>
      <stop offset="50%" stop-color="#002147"/>
      <stop offset="100%" stop-color="#00152e"/>
    </linearGradient>
    <linearGradient id="navyArchLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366"/>
      <stop offset="60%" stop-color="#002147"/>
      <stop offset="100%" stop-color="#001833"/>
    </linearGradient>

    <!-- Rich Gold Gradients -->
    <linearGradient id="goldPlumeLight" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#9a7210"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="65%" stop-color="#fed668"/>
      <stop offset="85%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7210"/>
    </linearGradient>
    <linearGradient id="goldFacetLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe896"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6308"/>
    </linearGradient>
    <linearGradient id="goldLegLight" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#9a7210"/>
      <stop offset="25%" stop-color="#d4af37"/>
      <stop offset="55%" stop-color="#fed668"/>
      <stop offset="80%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#7a5504"/>
    </linearGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Main Letter R Body: Classical Stem & Bold Outer Arch (Navy #002147) -->
    <path d="M 80 92 
             C 80 82, 102 74, 134 74 
             L 282 74 
             C 342 74, 404 108, 404 184 
             C 404 246, 356 288, 296 294 
             C 272 297, 240 297, 218 296 
             L 218 412 
             C 218 424, 230 430, 252 430 
             L 260 430 
             L 260 446 
             L 80 446 
             L 80 430 
             L 94 430 
             C 114 430, 126 424, 126 412 
             L 126 126 
             C 126 114, 114 108, 94 108 
             L 80 108 
             Z" 
          fill="url(#navyStemLight)" />

    <!-- Negative Space Cutout inside R loop for the Plumes -->
    <path d="M 218 122 
             L 272 122 
             C 314 122, 344 148, 344 188 
             C 344 226, 314 252, 272 252 
             L 218 252 
             Z" 
          fill="#ffffff" opacity="0.99" />

    <!-- Feather Plume 1 (Top Wing Ray) -->
    <path d="M 172 254 
             C 188 206, 222 144, 290 126 
             L 302 144 
             C 252 162, 224 212, 210 254 
             Z" 
          fill="url(#goldPlumeLight)" />

    <!-- Feather Plume 2 (Middle Wing Ray with faceted bevel) -->
    <path d="M 186 260 
             C 208 214, 244 162, 324 148 
             L 334 166 
             C 268 184, 238 230, 224 262 
             Z" 
          fill="url(#goldFacetLight)" />

    <!-- Feather Plume 3 (Inner Crest Wing Ray) -->
    <path d="M 204 262 
             C 226 226, 266 182, 346 174 
             C 346 190, 318 226, 280 258 
             C 256 264, 230 264, 204 262 
             Z" 
          fill="url(#goldPlumeLight)" />

    <!-- Bottom Right Swooping Leg of the R (Graceful Curved Golden Quill) -->
    <path d="M 218 296 
             C 264 286, 320 306, 362 338 
             C 410 374, 452 422, 486 446 
             C 454 444, 412 432, 372 404 
             C 328 372, 280 348, 226 342 
             C 204 340, 194 332, 204 316 
             Z" 
          fill="url(#goldLegLight)" />

    <!-- Gold Accent highlight on upper loop shoulder -->
    <path d="M 280 74 
             C 326 74, 386 98, 396 156 
             C 392 142, 356 86, 284 86 
             Z" 
          fill="url(#goldFacetLight)" opacity="0.75" />
  </g>
</svg>
